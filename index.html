   (vem do que já foi usado nos lançamentos, sem precisar de tabela extra no banco). */
const SUBTIPOS={
  fazenda:["Ração e suplementação","Sal mineral","Vacinas e medicamentos","Compra de animais","Frete de animais","Manutenção de máquinas e trator","Combustível","Mão de obra","Insumos e sementes","Cercas e curral","Outros"],

const NOVO_TIPO="__novo__";
function listaSubtipos(tipoChave){
  const preset=(SUBTIPOS[tipoChave]||[]).filter(x=>x!=="Outros");
  const usados=new Set();
  state.transactions.forEach(t=>{
    const pertence=tipoChave==="faturamento"?t.type==="faturamento":(t.type==="gasto"&&t.category===tipoChave);
    if(pertence&&t.subtipo)usados.add(t.subtipo);
  });
  const extras=[...usados].filter(u=>!preset.includes(u)).sort((a,b)=>a.localeCompare(b,"pt-BR"));
  return[...preset,...extras,"Outros"];
}
function optsSubtipoHTML(tipoChave,valorAtual){
  const opts=listaSubtipos(tipoChave);
  return opts.map(o=>`<option value="${escapeHtml(o)}" ${o===valorAtual?"selected":""}>${escapeHtml(o)}</option>`).join("")
    +`<option value="${NOVO_TIPO}">+ Cadastrar novo tipo…</option>`;
}
function wireSeletorTipo(selectEl,tipoChave){
  selectEl.onchange=()=>{
    if(selectEl.value!==NOVO_TIPO)return;
    const novo=prompt("Nome do novo tipo:");
    if(novo&&novo.trim()){
      const nome=novo.trim();
      const opt=document.createElement("option");
      opt.value=nome;opt.textContent=nome;
      selectEl.insertBefore(opt,selectEl.lastElementChild);
      selectEl.value=nome;
    }else{
      const opts=listaSubtipos(tipoChave);
      selectEl.value=opts[0]||"Outros";
    }
  };
}

function createDemoClient(){
  let rows=seedDemoData();
  return{
    auth:{
      getSession:async()=>({data:{session:null}}),
      onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),
      signInWithPassword:async()=>({error:null}),
      signOut:async()=>({error:null})
    },
    channel(){return{on(){return this;},subscribe(){return this;}};},
    removeChannel(){},
    from(){
      return{
        select(){return{order(col,opts){
          const asc=!!(opts&&opts.ascending);
          const sorted=rows.slice().sort((a,b)=>asc?String(a[col]).localeCompare(String(b[col])):String(b[col]).localeCompare(String(a[col])));
          return Promise.resolve({data:sorted,error:null});
        }};},
        insert(obj){rows.push(Object.assign({id:"demo-"+Math.random().toString(36).slice(2)},obj));return Promise.resolve({error:null});},
        update(patch){return{eq(col,val){const row=rows.find(r=>r[col]===val);if(row)Object.assign(row,patch);return Promise.resolve({error:null});}};},
        delete(){return{eq(col,val){rows=rows.filter(r=>r[col]!==val);return Promise.resolve({error:null});}};}
      };
    }
  };
}

/* ---------------- Login ---------------- */
/* Cadastro público removido por segurança: como a chave anon é pública e o RLS libera
   leitura/escrita para qualquer usuário autenticado, um cadastro aberto permitiria que
   qualquer pessoa que encontrasse o link criasse uma conta e acessasse todos os dados.
   Contas agora só podem ser criadas pelo administrador (painel Supabase → Authentication
   → Users → Add user), como já era a opção recomendada no README. */
function showLogin(msg){
  state.mounted=false;
  document.getElementById("app").innerHTML=`
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>💰 Controle Financeiro</h1>
        <p class="sub">Entre com seu e-mail e senha</p>
        <div id="authMsg"></div>
        <div class="field"><label>E-mail</label><input type="email" id="au-email" placeholder="voce@email.com"></div>
        <div class="field"><label>Senha</label><input type="password" id="au-pass" placeholder="••••••••"></div>
        <button class="btn" id="au-go">Entrar</button>
        <div class="note" style="text-align:center;margin-top:16px">Não tem conta? Peça para quem administra o sistema criar seu acesso.</div>
      </div>
    </div>`;
  if(msg) setAuthMsg(msg.text,msg.type);
  const go=async()=>{
    const email=document.getElementById("au-email").value.trim();
    const pass=document.getElementById("au-pass").value;
    if(!email||!pass){setAuthMsg("Preencha e-mail e senha.","err");return;}
    document.getElementById("au-go").disabled=true;
    const {error}=await db.auth.signInWithPassword({email,password:pass});
    document.getElementById("au-go").disabled=false;
    if(error){setAuthMsg(mensagemErroLogin(error),"err");return;}
  };
  document.getElementById("au-go").onclick=go;
  document.getElementById("au-pass").onkeydown=e=>{if(e.key==="Enter")go();};
}
function setAuthMsg(text,type){document.getElementById("authMsg").innerHTML=`<div class="auth-msg ${type}">${text}</div>`;}
/* Traduz os erros mais comuns do Supabase Auth para uma mensagem que explica o que fazer,
   em vez de sempre dizer "e-mail ou senha inválidos" (o que escondia, por exemplo, o caso
   de um usuário criado pelo admin mas ainda pendente de confirmação de e-mail). */
function mensagemErroLogin(error){
  const m=(error&&error.message)||"";
  if(/email not confirmed/i.test(m))
    return "Este e-mail ainda não foi confirmado. Peça ao administrador para confirmar o acesso (painel Supabase → SQL Editor, ou desligar \"Confirm email\" em Authentication → Providers → Email).";
  if(/invalid login credentials/i.test(m))
    return "E-mail ou senha incorretos.";
  if(/rate limit/i.test(m))
    return "Muitas tentativas seguidas. Aguarde um minuto e tente novamente.";
  return "Não foi possível entrar: "+(m||"erro desconhecido")+".";
}

/* ---------------- Montagem do app ---------------- */
async function mountApp(){
  state.mounted=true;
  await loadData();
  render();
  // tempo real: recarrega quando alguém insere/edita/exclui
  try{
    state.channel=db.channel("tx-"+Math.random().toString(36).slice(2))
      .on("postgres_changes",{event:"*",schema:"public",table:"transactions"},()=>autoRefresh())
      .subscribe();
  }catch(e){/* segue sem realtime */}
}
function unmountApp(){
  if(state.channel){try{db.removeChannel(state.channel);}catch(e){}state.channel=null;}
  charts.forEach(c=>c.destroy());charts=[];
  state.mounted=false;
}
function autoRefresh(){
  const a=document.activeElement;
  const digitando=a&&(a.tagName==="INPUT"||a.tagName==="SELECT");
  loadData().then(()=>{if(!digitando)render();});
}

/* ---------------- Dados (Supabase) ---------------- */
async function loadData(){
  const {data,error}=await db.from("transactions").select("*").order("date",{ascending:false});
  if(error){console.error(error);alert("Erro ao carregar dados: "+error.message);state.transactions=[];return;}
  state.transactions=(data||[]).map(r=>({id:r.id,type:r.type,category:r.category,subtipo:r.subtipo,description:r.description,amount:Number(r.amount),date:r.date}));
}
async function addTx(tx){
  const {error}=await db.from("transactions").insert({type:tx.type,category:tx.category,subtipo:tx.subtipo,description:tx.description,amount:tx.amount,date:tx.date});
  if(error){alert("Erro ao salvar: "+error.message);return false;}
  return true;
}
async function updateTx(id,patch){
  const {error}=await db.from("transactions").update(patch).eq("id",id);
  if(error){alert("Erro ao atualizar: "+error.message);return false;}
  return true;
}
async function removeTx(id){
  const {error}=await db.from("transactions").delete().eq("id",id);
  if(error){alert("Erro ao excluir: "+error.message);return false;}
  return true;
}

/* ---------------- Utilitários ---------------- */
const fmt=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const anoDe=d=>parseInt(d.slice(0,4),10);
const mesDe=d=>parseInt(d.slice(5,7),10)-1;
function anosDisponiveis(){const s=new Set(state.transactions.map(t=>anoDe(t.date)));s.add(new Date().getFullYear());return[...s].sort((a,b)=>a-b);}
function serieMensal(f,ano){const a=Array(12).fill(0);state.transactions.filter(f).filter(t=>anoDe(t.date)===ano).forEach(t=>{a[mesDe(t.date)]+=t.amount;});return a;}
function serieAnual(f){const m={};state.transactions.filter(f).forEach(t=>{const a=anoDe(t.date);m[a]=(m[a]||0)+t.amount;});return m;}
function regressao(p){const n=p.length;if(n<2){const m=n===1?p[0].y:0;return{f:()=>m,slope:0};}let sx=0,sy=0,sxy=0,sxx=0;p.forEach(o=>{sx+=o.x;sy+=o.y;sxy+=o.x*o.y;sxx+=o.x*o.x;});const d=n*sxx-sx*sx;if(d===0){const m=sy/n;return{f:()=>m,slope:0};}const slope=(n*sxy-sx*sy)/d,b=(sy-slope*sx)/n;return{f:x=>Math.max(0,b+slope*x),slope};}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function rotuloMes(k){return MESES[k%12]+"/"+String(Math.floor(k/12)).slice(2);}
function dataLocalHoje(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ---------------- Render principal ---------------- */
function render(){
  charts.forEach(c=>c.destroy());charts=[];
  const email=state.session?.user?.email||"";
  const quemTag=state.demo?`🧪 Modo demonstração — dados fictícios, nada é salvo`:`Conectado como <b>${escapeHtml(email)}</b>`;
  document.getElementById("app").innerHTML=`
    <div class="topbar">
      <div class="who">${quemTag}</div>
      <div class="actions">
        <button class="btn ghost" id="bt-refresh">↻ Atualizar</button>
        <button class="btn ghost" id="bt-export">⬇ Backup (Excel)</button>
        <button class="btn ghost" id="bt-logout">${state.demo?"Sair da demonstração":"Sair"}</button>
      </div>
    </div>
    <h1>💰 Controle Financeiro</h1>
    <div class="subtitle">${state.demo?"Você está explorando com dados de exemplo — configure o Supabase (veja o README) para usar com dados reais.":"Banco online compartilhado — todos que fazem login acessam os mesmos dados."}</div>
    <div class="tabs">
      ${tabBtn("resumo","📊 Resumo")}${tabBtn("fazenda","🌾 Fazenda")}${tabBtn("construcao","🏗️ Construção")}${tabBtn("moradia","🏠 Moradia")}${tabBtn("faturamento","💵 Faturamento")}
    </div>
    <div id="content"></div>`;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();});
  document.getElementById("bt-refresh").onclick=async()=>{await loadData();render();};
  document.getElementById("bt-export").onclick=exportarExcel;
  document.getElementById("bt-logout").onclick=async()=>{if(state.demo){sairDemo();}else{await db.auth.signOut();}};
  const c=document.getElementById("content");
  if(state.tab==="resumo")renderResumo(c);
  else if(state.tab==="faturamento")renderLancamentos(c,"faturamento");
  else renderLancamentos(c,state.tab);
}
function tabBtn(id,label){return `<button class="tab ${state.tab===id?"active":""}" data-tab="${id}">${label}</button>`;}

/* ---------------- Lançamentos ---------------- */
function renderLancamentos(c,tipo){
  const isFat=tipo==="faturamento";
  const cor=isFat?COR_FAT:CATS[tipo].cor;
  const nome=isFat?"Faturamento":CATS[tipo].nome;
  const filtro=isFat?(t=>t.type==="faturamento"):(t=>t.type==="gasto"&&t.category===tipo);
  const hoje=dataLocalHoje();
  c.innerHTML=`
    <div class="card">
      <h2>Novo lançamento — ${nome}</h2>
      <div class="row">
        <div class="field"><label>Data</label><input type="date" id="f-data" value="${hoje}"></div>
        <div class="field"><label>Tipo</label><select id="f-tipo">${optsSubtipoHTML(tipo,"")}</select></div>
        <div class="field" style="flex:2"><label>Descrição</label><input type="text" id="f-desc" placeholder="${isFat?"Ex.: Venda de gado":"Ex.: Compra de insumos"}"></div>
        <div class="field"><label>Valor (R$)</label><input type="number" id="f-valor" step="0.01" min="0" placeholder="0,00"></div>
        <div class="field" style="flex:0"><label>&nbsp;</label><button class="btn accent-${tipo}" id="f-add">Adicionar</button></div>
      </div>
    </div>
    <div class="card">
      <div class="filterbar"><strong>Lançamentos</strong><select id="flt-ano"></select><select id="flt-mes"></select></div>
      <div id="lista"></div>
    </div>`;
  wireSeletorTipo(document.getElementById("f-tipo"),tipo);
  const selAno=document.getElementById("flt-ano");
  selAno.innerHTML=`<option value="todos">Todos os anos</option>`+anosDisponiveis().map(a=>`<option value="${a}" ${a===state.ano?"selected":""}>${a}</option>`).join("");
  const selMes=document.getElementById("flt-mes");
  selMes.innerHTML=`<option value="todos">Todos os meses</option>`+MESES.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
  let editandoId=null;
  function linhaNormal(t){
    return `<tr><td>${t.date.split("-").reverse().join("/")}</td><td>${escapeHtml(t.subtipo||"—")}</td><td>${escapeHtml(t.description||"—")}</td><td class="amount">${fmt(t.amount)}</td><td class="row-actions"><button class="rowbtn edit" data-id="${t.id}">editar</button><button class="del" data-id="${t.id}">excluir</button></td></tr>`;
  }
  function linhaEdicao(t){
    return `<tr class="editing">
      <td><input type="date" class="ed-data" value="${t.date}"></td>
      <td><select class="ed-tipo">${optsSubtipoHTML(tipo,t.subtipo||"")}</select></td>
      <td><input type="text" class="ed-desc" value="${escapeHtml(t.description||"")}"></td>
      <td class="amount"><input type="number" class="ed-valor" step="0.01" min="0" value="${t.amount}" style="text-align:right"></td>
      <td class="row-actions"><button class="rowbtn save" data-id="${t.id}">salvar</button><button class="rowbtn cancel" data-id="${t.id}">cancelar</button></td>
    </tr>`;
  }
  function pinta(){
    const fa=selAno.value,fm=selMes.value;
    let it=state.transactions.filter(filtro);
    if(fa!=="todos")it=it.filter(t=>anoDe(t.date)===+fa);
    if(fm!=="todos")it=it.filter(t=>mesDe(t.date)===+fm);
    it.sort((a,b)=>b.date.localeCompare(a.date));
    const total=it.reduce((s,t)=>s+t.amount,0);
    const lista=document.getElementById("lista");
    if(!it.length){lista.innerHTML=`<div class="empty">Nenhum lançamento neste período.</div>`;return;}
    lista.innerHTML=`<table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th class="amount">Valor</th><th></th></tr></thead><tbody>
      ${it.map(t=>t.id===editandoId?linhaEdicao(t):linhaNormal(t)).join("")}
      </tbody></table><div class="total-line"><span>Total do período</span><span style="color:${cor}">${fmt(total)}</span></div>`;
    const edTipo=lista.querySelector(".ed-tipo");
    if(edTipo)wireSeletorTipo(edTipo,tipo);
    lista.querySelectorAll(".edit").forEach(b=>b.onclick=()=>{editandoId=b.dataset.id;pinta();});
    lista.querySelectorAll(".cancel").forEach(b=>b.onclick=()=>{editandoId=null;pinta();});
    lista.querySelectorAll(".save").forEach(b=>b.onclick=async()=>{
      const tr=b.closest("tr");
      const novaData=tr.querySelector(".ed-data").value;
      const novoTipo=tr.querySelector(".ed-tipo").value;
      const novaDesc=tr.querySelector(".ed-desc").value.trim();
      const novoValor=parseFloat(tr.querySelector(".ed-valor").value);
      if(!novaData||!novoValor||novoValor<=0){alert("Preencha data e um valor válido.");return;}
      if(novoTipo===NOVO_TIPO){alert("Escolha ou cadastre um tipo válido.");return;}
      tr.querySelectorAll("button").forEach(x=>x.disabled=true);
      const ok=await updateTx(b.dataset.id,{date:novaData,subtipo:novoTipo,description:novaDesc,amount:novoValor});
      if(ok){editandoId=null;await loadData();render();}
      else tr.querySelectorAll("button").forEach(x=>x.disabled=false);
    });
    lista.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(!confirm("Excluir este lançamento?"))return;if(await removeTx(b.dataset.id)){await loadData();render();}});
  }
  selAno.onchange=pinta;selMes.onchange=pinta;pinta();
  document.getElementById("f-add").onclick=async()=>{
    const data=document.getElementById("f-data").value;
    const subtipo=document.getElementById("f-tipo").value;
    const desc=document.getElementById("f-desc").value.trim();
    const valor=parseFloat(document.getElementById("f-valor").value);
    if(!data||!valor||valor<=0){alert("Preencha data e um valor válido.");return;}
    if(subtipo===NOVO_TIPO){alert("Escolha ou cadastre um tipo válido.");return;}
    const btnAdd=document.getElementById("f-add");
    btnAdd.disabled=true;
    const ok=await addTx(isFat?{type:"faturamento",category:null,subtipo,description:desc,amount:valor,date:data}:{type:"gasto",category:tipo,subtipo,description:desc,amount:valor,date:data});
    if(ok){await loadData();render();}
    else btnAdd.disabled=false;
  };
}

/* ---------------- Resumo + previsões ---------------- */
function renderResumo(c){
  const anos=anosDisponiveis();
  c.innerHTML=`
    <div class="card">
      <div class="filterbar"><strong>Ano de referência</strong><select id="res-ano">${anos.map(a=>`<option value="${a}" ${a===state.ano?"selected":""}>${a}</option>`).join("")}</select></div>
      <div class="stat-grid" id="stats"></div>
    </div>
    <div class="card"><h2>Gastos × Faturamento — mensal (${state.ano})</h2><div class="chart-wrap"><canvas id="ch-mensal"></canvas></div></div>
    <div class="card"><h2>Comparativo anual</h2><div class="chart-wrap"><canvas id="ch-anual"></canvas></div></div>
    <div class="card"><h2>📈 Previsão dos próximos 6 meses</h2><div class="chart-wrap"><canvas id="ch-prev"></canvas></div><div class="note" id="prev-note"></div></div>
    <div class="card"><h2>🔮 Previsão anual</h2><div id="prev-anual"></div></div>`;
  document.getElementById("res-ano").onchange=e=>{state.ano=+e.target.value;render();};

  const fG=t=>t.type==="gasto",fF=t=>t.type==="faturamento";
  const gastoAno=serieMensal(fG,state.ano).reduce((a,b)=>a+b,0);
  const fatAno=serieMensal(fF,state.ano).reduce((a,b)=>a+b,0);
  const saldo=fatAno-gastoAno;
  document.getElementById("stats").innerHTML=`
    ${stat("Faturamento "+state.ano,fmt(fatAno),"pos")}
    ${stat("Gastos "+state.ano,fmt(gastoAno),"neg")}
    ${stat("Saldo "+state.ano,fmt(saldo),saldo>=0?"pos":"neg")}
    ${stat("Fazenda",fmt(serieMensal(t=>t.type==="gasto"&&t.category==="fazenda",state.ano).reduce((a,b)=>a+b,0)))}
    ${stat("Construção",fmt(serieMensal(t=>t.type==="gasto"&&t.category==="construcao",state.ano).reduce((a,b)=>a+b,0)))}
    ${stat("Moradia",fmt(serieMensal(t=>t.type==="gasto"&&t.category==="moradia",state.ano).reduce((a,b)=>a+b,0)))}`;

  const mFaz=serieMensal(t=>t.type==="gasto"&&t.category==="fazenda",state.ano);
  const mCon=serieMensal(t=>t.type==="gasto"&&t.category==="construcao",state.ano);
  const mMor=serieMensal(t=>t.type==="gasto"&&t.category==="moradia",state.ano);
  const mFat=serieMensal(fF,state.ano);
  charts.push(new Chart(document.getElementById("ch-mensal"),{data:{labels:MESES,datasets:[
    {type:"bar",label:"Fazenda",data:mFaz,backgroundColor:CATS.fazenda.cor,stack:"g"},
    {type:"bar",label:"Construção",data:mCon,backgroundColor:CATS.construcao.cor,stack:"g"},
    {type:"bar",label:"Moradia",data:mMor,backgroundColor:CATS.moradia.cor,stack:"g"},
    {type:"line",label:"Faturamento",data:mFat,borderColor:COR_FAT,backgroundColor:COR_FAT,borderWidth:3,tension:.25,pointRadius:3}]},options:opts(true)}));

  const gA=serieAnual(fG),fA=serieAnual(fF);
  const todos=[...new Set([...Object.keys(gA),...Object.keys(fA)])].map(Number).sort((a,b)=>a-b);
  charts.push(new Chart(document.getElementById("ch-anual"),{type:"bar",data:{labels:todos,datasets:[
    {label:"Gastos",data:todos.map(a=>gA[a]||0),backgroundColor:"#d0422e"},
    {label:"Faturamento",data:todos.map(a=>fA[a]||0),backgroundColor:COR_FAT}]},options:opts(false)}));

  previsoes(fG,fF);
}
function stat(l,v,cls=""){return `<div class="stat"><div class="label">${l}</div><div class="value ${cls}">${v}</div></div>`;}

function previsoes(fG,fF){
  const hist=f=>{const m={};state.transactions.filter(f).forEach(t=>{const k=anoDe(t.date)*12+mesDe(t.date);m[k]=(m[k]||0)+t.amount;});return m;};
  const hG=hist(fG),hF=hist(fF);
  const chaves=[...new Set([...Object.keys(hG),...Object.keys(hF)])].map(Number).sort((a,b)=>a-b);
  const noteEl=document.getElementById("prev-note"),anualEl=document.getElementById("prev-anual");
  if(chaves.length<2){
    document.getElementById("ch-prev").parentElement.innerHTML=`<div class="empty">Adicione lançamentos em pelo menos 2 meses diferentes para gerar previsões.</div>`;
    noteEl.innerHTML="";anualEl.innerHTML=`<div class="empty">Dados insuficientes para projeção anual.</div>`;return;
  }
  const base=chaves[0];
  const rG=regressao(chaves.map(k=>({x:k-base,y:hG[k]||0})));
  const rF=regressao(chaves.map(k=>({x:k-base,y:hF[k]||0})));
  const ult=chaves[chaves.length-1],ini=Math.max(base,ult-5);
  const labels=[],histG=[],histF=[],prevG=[],prevF=[];
  for(let k=ini;k<=ult;k++){labels.push(rotuloMes(k));histG.push(hG[k]||0);histF.push(hF[k]||0);prevG.push(null);prevF.push(null);}
  for(let i=1;i<=6;i++){const k=ult+i;labels.push(rotuloMes(k));histG.push(null);histF.push(null);prevG.push(Math.round(rG.f(k-base)));prevF.push(Math.round(rF.f(k-base)));}
  const idx=ult-ini;prevG[idx]=histG[idx];prevF[idx]=histF[idx];
  charts.push(new Chart(document.getElementById("ch-prev"),{type:"line",data:{labels,datasets:[
    {label:"Gastos (real)",data:histG,borderColor:"#d0422e",backgroundColor:"#d0422e",borderWidth:3,tension:.2,pointRadius:3},
    {label:"Gastos (previsto)",data:prevG,borderColor:"#d0422e",borderDash:[6,5],borderWidth:2,tension:.2,pointRadius:2},
    {label:"Faturamento (real)",data:histF,borderColor:COR_FAT,backgroundColor:COR_FAT,borderWidth:3,tension:.2,pointRadius:3},
    {label:"Faturamento (previsto)",data:prevF,borderColor:COR_FAT,borderDash:[6,5],borderWidth:2,tension:.2,pointRadius:2}]},options:opts(false)}));
  let tG=0,tF=0;for(let i=1;i<=6;i++){tG+=rG.f(ult+i-base);tF+=rF.f(ult+i-base);}
  const tend=v=>v>1?"em alta":v<-1?"em queda":"estável";
  noteEl.innerHTML=`Projeção dos próximos 6 meses (tendência linear sobre o histórico): gastos <strong>${tend(rG.slope)}</strong>, faturamento <strong>${tend(rF.slope)}</strong>. Total previsto: gastos ${fmt(tG)} · faturamento ${fmt(tF)} · saldo estimado <strong style="color:${tF-tG>=0?CATS.fazenda.cor:'var(--danger)'}">${fmt(tF-tG)}</strong>.<br>São estimativas — quanto mais histórico, mais precisas.`;
  const anoUlt=Math.floor(ult/12);
  const linhas=[anoUlt+1,anoUlt+2].map(ano=>{let pg=0,pf=0;for(let m=0;m<12;m++){const k=ano*12+m;pg+=rG.f(k-base);pf+=rF.f(k-base);}return{ano,pg,pf};});
  anualEl.innerHTML=`<table><thead><tr><th>Ano</th><th class="amount">Gastos previstos</th><th class="amount">Faturamento previsto</th><th class="amount">Saldo estimado</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td><strong>${l.ano}</strong></td><td class="amount">${fmt(l.pg)}</td><td class="amount">${fmt(l.pf)}</td><td class="amount" style="color:${l.pf-l.pg>=0?CATS.fazenda.cor:'var(--danger)'};font-weight:700">${fmt(l.pf-l.pg)}</td></tr>`).join("")}
    </tbody></table><div class="note">Projeção da tendência mensal aplicada a 12 meses de cada ano.</div>`;
}

function opts(stacked){return{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
  scales:{x:{stacked,grid:{display:false}},y:{stacked,beginAtZero:true,ticks:{callback:v=>"R$ "+v.toLocaleString("pt-BR")}}},
  plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+": "+fmt(ctx.parsed.y||0)}}}};}

/* ---------------- Backup em Excel ----------------
   Exporta TODOS os lançamentos (não só os do filtro/aba atual) em duas abas: a lista
   completa e um resumo por ano/categoria. Serve como cópia de segurança, já que o plano
   gratuito do Supabase não faz backup automático (ver README). */
function exportarExcel(){
  if(!state.transactions.length){alert("Não há lançamentos para exportar.");return;}
  const rows=state.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>({
    Data:t.date.split("-").reverse().join("/"),
    Tipo:t.type==="faturamento"?"Faturamento":"Gasto",
    Categoria:t.category?CATS[t.category].nome:"—",
    Item:t.subtipo||"—",
    Descrição:t.description||"",
    "Valor (R$)":t.amount
  }));
  const anos=anosDisponiveis().filter(a=>state.transactions.some(t=>anoDe(t.date)===a));
  const resumo=anos.map(ano=>{
    const gFaz=serieMensal(t=>t.type==="gasto"&&t.category==="fazenda",ano).reduce((a,b)=>a+b,0);
    const gCon=serieMensal(t=>t.type==="gasto"&&t.category==="construcao",ano).reduce((a,b)=>a+b,0);
    const gMor=serieMensal(t=>t.type==="gasto"&&t.category==="moradia",ano).reduce((a,b)=>a+b,0);
    const fat=serieMensal(t=>t.type==="faturamento",ano).reduce((a,b)=>a+b,0);
    const totalGastos=gFaz+gCon+gMor;
    return{Ano:ano,"Gastos Fazenda":gFaz,"Gastos Construção":gCon,"Gastos Moradia":gMor,"Total Gastos":totalGastos,"Faturamento":fat,"Saldo":fat-totalGastos};
  });
  const ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:12},{wch:14},{wch:14},{wch:24},{wch:34},{wch:14}];
  const wsResumo=XLSX.utils.json_to_sheet(resumo);
  wsResumo["!cols"]=[{wch:8},{wch:16},{wch:18},{wch:16},{wch:14},{wch:14},{wch:14}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Lançamentos");
  XLSX.utils.book_append_sheet(wb,wsResumo,"Resumo por ano");
  XLSX.writeFile(wb,"controle-financeiro-backup-"+dataLocalHoje()+".xlsx");
}
